name: Bug
description: Algo no funciona como debería
labels: ["tipo:bug", "estado:nuevo"]
body:
  - type: input
    id: resumen
    attributes:
      label: Resumen
      description: Una línea que diga qué falla
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado y resultado actual
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o logs
      description: Arrastrá imágenes acá. Si no hay, escribí "sin evidencia".
  - type: textarea
    id: fuera
    attributes:
      label: Fuera de alcance
      description: Qué NO hay que tocar
